worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # WebSocket upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream deepstream {
        server 127.0.0.1:6020;
    }

    # Static files — Fastly origin
    server {
        listen 80;
        server_name makers21.orbs.com;
        root /home/ubuntu/makers21/dist;

        include /etc/nginx/mime.types;
    }

    # Redirect bare HTTP on ws subdomain to HTTPS
    server {
        listen 80;
        server_name ws-makers.orbs.com;
        return 301 https://$host$request_uri;
    }

    # WSS termination for Deepstream
    server {
        listen 443 ssl;
        server_name ws-makers.orbs.com;

        ssl_certificate     /etc/letsencrypt/live/ws-makers.orbs.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ws-makers.orbs.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://deepstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # WebSocket upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream makers21 {
        server 127.0.0.1:4000;
    }

    # ===== HTTP origin for Fastly =====
    # Fastly fronts makers21.orbs.com and hits this server on port 80.
    # We just reverse-proxy everything to server (lobby, /api/*, /assets/*,
    # game.html, dist/* — server handles all of these).
    server {
        listen 80;
        server_name makers21.orbs.com;

        # Long timeouts for any /ws requests that come this way (in case
        # Fastly ever passes them through — normally WS goes via the wss subdomain)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Standalone side page — served directly from disk, no proxy.
        # /maze (no trailing slash) gets a 301 to /maze/ so relative
        # asset paths inside index.html resolve correctly.
        location = /maze { return 301 /maze/; }
        location /maze/ {
            alias /home/ubuntu/noga-maze/;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location / {
            proxy_pass http://makers21;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===== Redirect bare HTTP on the WS subdomain to HTTPS =====
    server {
        listen 80;
        server_name ws-makers.orbs.com;
        return 301 https://$host$request_uri;
    }

    # ===== WSS termination — bypasses Fastly =====
    # Browser connects directly here for the /ws WebSocket.
    # nginx terminates TLS with the Let's Encrypt cert (already on the box
    # from the old deepstream setup), then proxies to server.
    server {
        listen 443 ssl http2;
        server_name ws-makers.orbs.com;

        ssl_certificate     /etc/letsencrypt/live/ws-makers.orbs.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ws-makers.orbs.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://makers21;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>
  <meta name="description" content="Multiplayer spaceship game with head tracking controls - capture the flag style">

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-61VHXBDG88"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-61VHXBDG88');
  </script>
</head>

<body>
  <!-- Camera input for face tracking -->
  <video style="display: none;" class="input_video"></video>

  <!-- Server selection dialog (hidden by default, shown via JS) -->
  <div id="server-dialog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: #222; padding: 30px; border-radius: 10px; text-align: center; border: 2px solid #444;">
      <h2 style="color: #fff; margin-bottom: 20px;">Choose Server</h2>
      <div style="margin-bottom: 15px;">
        <label for="server-input" style="color: #ccc; display: block; margin-bottom: 8px;">Server address:</label>
        <input type="text" id="server-input" style="width: 300px; padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #666; background: #333; color: #fff;">
      </div>
      <input type="button" id="server-connect" class="btn" value="Connect" style="padding: 10px 30px; font-size: 16px; cursor: pointer;">
    </div>
  </div>

  <!-- Welcome screen -->
  <div id="welcome" style="display: none;">
    <h1>Makers2021 Welcome</h1>
    <div id="online">Please wait...</div>
    <div id="started"></div>

    <!-- Teams display -->
    <div id="teams" style="display:none;">
      <div class="red"><span>Red team: </span><span id="red-team"></span></div>
      <div class="blue"><span>Blue team: </span><span id="blue-team"></span></div>
    </div>

    <!-- User inputs -->
    <div id="inputs" style="display:none">
      <label for="nick">Nickname:</label>
      <input type="text" id="nick" name="nick"><br><br>

      <!-- Team selection -->
      <div id="choose-team" style="display:none">
        <div>Choose team:</div>
        <div class="team-label">
          <input type="radio" id="red" name="team" value="red" checked>
          <label for="team" class="red">RED</label>
        </div>
        <div class="team-label">
          <input type="radio" id="blue" name="team" value="blue">
          <label for="team" class="blue">BLUE</label>
        </div>
        <input type="button" id="join" class="btn" value="Join">
      </div>
    </div>

    <!-- Joined status -->
    <div id="joined" style="display:none">
      <div>
        You are joined as <span id="nick-join"></span> to the <span id="team-join"></span> team
      </div>
      <input type="button" id="leave" class="btn" value="Leave">
    </div>

    <!-- Ready status -->
    <div id="ready">
      <div id="ready-text"></div>
      <input type="button" id="start" class="btn" value="Start Game" style="display:none">
      <input type="button" id="reset" class="btn" value="Reset Game" style="display:none">
    </div>

    <!-- Request start -->
    <div id="req-start" style="display:none">Requesting start from server...</div>
  </div>

  <!-- Game display -->
  <div id="game-display">
    <span id="msg"></span>
  </div>

  <!-- Game over screen -->
  <div id="game-over" style="display:none">
    <h1>GAME OVER!</h1>
    <p id="winnerNick"></p>
    <p id="winnerIsRed"></p>
  </div>

  <!-- Face mesh preview -->
  <canvas style="position: fixed; height: 144px; width: 256px; left: 0; top: 0; transform: scale(-1, 1);"
    class="output_canvas" width="256px" height="144px"></canvas>
  <span id="preview-coords"
    style="position: fixed; left: 10px; top: 10px; font-size: 14px; font-family: Arial; color: #00FFA0"></span>
  <span id="preview-dir"
    style="position: fixed; left: 170px; top: 10px; font-size: 14px; font-family: Arial; color: #00FFA0"></span>

  <!-- Audio elements -->
  <audio id="ping" preload="auto">
    <source src="assets/sounds/sound/ping.mp3" type="audio/mpeg">
  </audio>
  <audio id="success" preload="auto">
    <source src="assets/sounds/sound/success.wav" type="audio/wav">
  </audio>
  <audio id="wrong" preload="auto">
    <source src="assets/sounds/sound/wrong.mp3" type="audio/mpeg">
  </audio>
  <audio id="laser" preload="auto">
    <source src="assets/sounds/sound/laser.wav" type="audio/wav">
  </audio>
  <audio id="laser_up" preload="auto">
    <source src="assets/sounds/sound/laser_up.wav" type="audio/wav">
  </audio>
  <audio id="laser_down" preload="auto">
    <source src="assets/sounds/sound/laser_down.wav" type="audio/wav">
  </audio>
  <audio id="locked" preload="auto">
    <source src="assets/sounds/sound/locked.wav" type="audio/wav">
  </audio>
  <audio id="locked-on" preload="auto">
    <source src="assets/sounds/sound/locked_on.mp3" type="audio/mpeg">
  </audio>
  <audio id="explode" preload="auto">
    <source src="assets/sounds/sound/explode.wav" type="audio/wav">
  </audio>
  <audio id="alarm" preload="auto" loop>
    <source src="assets/sounds/sound/alarm.wav" type="audio/wav">
  </audio>
</body>

</html>

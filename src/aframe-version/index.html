<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>
  <meta name="description" content="Multiplayer spaceship game with head tracking controls - A-Frame version">
</head>

<body>
  <!-- A-Frame Scene -->
  <a-scene id="scene">
    <!-- Assets -->
    <a-assets>
      <a-asset-item id="airplane" src="assets/models/airplane.obj"></a-asset-item>
    </a-assets>

    <a-entity id="player" visible=false obj-model="obj: #airplane" position="10 10 0" scale="10 10 10"></a-entity>

    <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>

    <!-- Boundary spheres -->
    <a-sphere position="0 0 200" radius="100" material="color: #FF00FF; transparent: true; opacity: 0.1"></a-sphere>
    <a-sphere position="0 0 -200" radius="100" material="color: #FF00FF; transparent: true; opacity: 0.1"></a-sphere>
    <a-sphere position="-200 0 0" radius="100" material="color: #0000FF; transparent: true; opacity: 0.1"></a-sphere>
    <a-sphere position="200 0 0" radius="100" material="color: #0000FF; transparent: true; opacity: 0.1"></a-sphere>

    <!-- Sky -->
    <a-sky color="#a3d0ed"></a-sky>

    <!-- Lights -->
    <a-light type="directional" castShadow="true" intensity="0.4" color="#D0EAF9;" position="5 3 1"></a-light>
    <a-light intensity="0.8" type="ambient" color="#B4C5EC"></a-light>

    <!-- Icebergs -->
    <a-cone class="iceberg" segments-radial="5" segments-height="3" height="1" radius-top="0.15" radius-bottom="0.5"
      position="3 -0.1 -1.5"></a-cone>
    <a-cone class="iceberg" segments-radial="7" segments-height="3" height="0.5" radius-top="0.25" radius-bottom="0.35"
      position="-3 -0.1 -0.5"></a-cone>
    <a-cone class="iceberg" segments-radial="6" segments-height="2" height="0.5" radius-top="0.25" radius-bottom="0.25"
      position="-5 -0.2 -3.5"></a-cone>

    <!-- Platform -->
    <a-cone scale="2 2 2" shadow position="0 -3.5 -1.5" rotation="90 0 0" radius-top="1.9" radius-bottom="1.9"
      segments-radial="20" segments-height="20" height="20" emissive="#005DED" emissive-intensity="0.1">
      <a-entity id="tree-container" position="0 .5 -1.5" rotation="-90 0 0"></a-entity>
    </a-cone>

    <!-- Camera -->
    <a-entity id="camera" camera="active: true" position="0 1.6 0" move-control>
      <a-entity id="cursor" cursor="fuse: true;fuseTimeout:500" material="color:silver" geometry="primitive:ring"
        position="0 0 -1" scale="0.01 0.01 0.01">
      </a-entity>
    </a-entity>
  </a-scene>

  <!-- Camera input for face tracking -->
  <video style="display: none;" class="input_video"></video>

  <!-- Control Panel -->
  <div id="control-panel" class="control-panel">
    <div>
      <label for="speed-control">Speed</label>
      <input type="range" min="1" max="100" value="50" class="slider" id="speed-control">
      <label id="speed-control-text" class="control-percentage">50%</label>
    </div>

    <div>
      <label for="hFactor-control">H Factor</label>
      <input type="range" min="1" max="100" value="50" class="slider" id="hFactor-control">
      <label id="hFactor-control-text" class="control-percentage">50%</label>
    </div>

    <div>
      <label for="vFactor-control">V Factor</label>
      <input type="range" min="1" max="100" value="50" class="slider" id="vFactor-control">
      <label id="vFactor-control-text" class="control-percentage">50%</label>
    </div>

    <div>
      <label for="alttd-control">Altitude</label>
      <input type="range" min="1" max="100" value="50" class="slider" id="alttd-control">
      <label id="alttd-control-text" class="control-percentage">50%</label>
    </div>

    <div>
      <label for="levelHrznRate-control">H Rate</label>
      <input type="range" min="1" max="100" value="50" class="slider" id="levelHrznRate-control">
      <label id="levelHrznRate-control-text" class="control-percentage">50%</label>
    </div>

    <div>
      <input type="button" id="reset-control" value="Reset Position" />
    </div>
  </div>

  <!-- Face mesh preview -->
  <canvas style="position: fixed; height: 144px; width: 256px; left: 0; top: 0; transform: scale(-1, 1);"
    class="output_canvas" width="256px" height="144px"></canvas>
  <span id="preview-coords"
    style="position: fixed; left: 10px; top: 10px; font-size: 14px; font-family: Arial; color: #00FFA0"></span>
  <span id="preview-dir"
    style="position: fixed; left: 170px; top: 10px; font-size: 14px; font-family: Arial; color: #00FFA0"></span>
</body>

</html>
